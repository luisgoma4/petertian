<!doctype html>
<html lang="pl" data-lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Tian — Poznań</title>
<meta name="description"
      data-pl-content="Peter Tian w Poznaniu: lekcje języka chińskiego oraz lekcje gitary i basu."
      data-en-content="Peter Tian in Poznań: Mandarin lessons, and guitar and bass lessons."
      content="Peter Tian w Poznaniu: lekcje języka chińskiego oraz lekcje gitary i basu.">
<meta name="theme-color" content="#14101C">
<meta property="og:type" content="website">
<meta property="og:title" content="Peter Tian — Poznań">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #14101C;
    color: #F4F1F8;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  a { text-decoration: none; color: inherit; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem clamp(1.25rem, 4vw, 2rem);
  }

  .name {
    margin: 0;
    font-size: clamp(1rem, 3vw, 1.25rem);
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .langbar { display: flex; gap: 0.25rem; }

  .langbar button {
    font: inherit;
    font-size: 0.8125rem;
    letter-spacing: 0.14em;
    padding: 0.4rem 0.7rem;
    border: 1px solid rgba(244, 241, 248, 0.28);
    background: transparent;
    color: rgba(244, 241, 248, 0.7);
    cursor: pointer;
    border-radius: 3px;
    transition: background 140ms ease, color 140ms ease;
  }

  .langbar button[aria-pressed="true"] {
    background: #F4F1F8;
    border-color: #F4F1F8;
    color: #14101C;
  }

  .doors {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr 1fr;
  }

  .door {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 7vw, 4rem) clamp(1.5rem, 5vw, 3.5rem);
    overflow: hidden;
    transition: flex-grow 320ms ease;
  }

  .door::before {
    content: "";
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.28;
    transition: opacity 320ms ease, transform 480ms ease;
  }

  .door > * { position: relative; }

  .door:hover::before, .door:focus-visible::before {
    opacity: 0.42;
    transform: scale(1.04);
  }

  .door:focus-visible { outline: 3px solid currentColor; outline-offset: -6px; }

  .door--mandarin {
    background: #F2E9D8;
    color: #1E3552;
  }
  .door--mandarin::before { background-image: url("mandarin/img/peter-900.webp"); }

  .door--music {
    background: #1D1729;
    color: #F4F1F8;
  }
  .door--music::before { background-image: url("music/img/live-900.webp"); }

  .kicker {
    font-size: clamp(0.7rem, 2.2vw, 0.8125rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.75;
    margin: 0 0 0.6rem;
  }

  .door h2 {
    margin: 0;
    font-size: clamp(1.75rem, 7vw, 3.25rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.015em;
    text-transform: uppercase;
  }

  .door--mandarin h2 { color: #8C2F27; }
  .door--music h2 { color: #F2A33C; }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.1rem;
    font-size: 0.9375rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .go svg { width: 1.1rem; height: 1.1rem; transition: transform 200ms ease; }
  .door:hover .go svg { transform: translateX(4px); }

  @media (min-width: 48rem) {
    .doors { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header>
  <h1 class="name">Peter Tian</h1>
  <nav class="langbar" aria-label="Język / Language">
    <button type="button" data-lang-set="pl" aria-pressed="true">PL</button>
    <button type="button" data-lang-set="en" aria-pressed="false">EN</button>
  </nav>
</header>

<main class="doors">

  <a class="door door--mandarin" href="mandarin/">
    <p class="kicker" data-pl="Nauka języka" data-en="Language">Nauka języka</p>
    <h2 data-pl="Lekcje języka<br>chińskiego" data-en="Mandarin<br>Lessons">Lekcje języka<br>chińskiego</h2>
    <span class="go">
      <span data-pl="Zobacz" data-en="Enter">Zobacz</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </span>
  </a>

  <a class="door door--music" href="music/">
    <p class="kicker" data-pl="Muzyka" data-en="Music">Muzyka</p>
    <h2 data-pl="Lekcje gitary<br>i basu" data-en="Guitar &amp; Bass<br>Lessons">Lekcje gitary<br>i basu</h2>
    <span class="go">
      <span data-pl="Zobacz" data-en="Enter">Zobacz</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </span>
  </a>

</main>

<script src="shared/i18n.js" defer></script>
</body>
</html>
